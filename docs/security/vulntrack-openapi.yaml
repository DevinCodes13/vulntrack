openapi: 3.0.0
info:
  title: VulnTrack API
  version: "1.0"
servers:
  - url: http://vulntrack-wildfly:8080/vulntrack/api
paths:
  /ping:
    get: { responses: { "200": { description: ok } } }
  /assets:
    get: { responses: { "200": { description: ok } } }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string, example: host-a }
                ipAddress: { type: string, example: 10.0.0.9 }
                assetType: { type: string, example: server }
                owner: { type: string, example: team }
      responses: { "201": { description: created } }
  /assets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    get: { responses: { "200": { description: ok } } }
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string, example: host-b }
      responses: { "200": { description: ok } }
  /vulnerabilities:
    get: { responses: { "200": { description: ok } } }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cveId: { type: string, example: CVE-2020-0001 }
                description: { type: string, example: test }
                severity: { type: string, example: HIGH }
                cvssScore: { type: number, example: 7.5 }
      responses: { "201": { description: created } }
  /vulnerabilities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    get: { responses: { "200": { description: ok } } }
  /findings:
    get: { responses: { "200": { description: ok } } }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId: { type: integer, example: 1 }
                vulnerabilityId: { type: integer, example: 1 }
                status: { type: string, example: OPEN }
      responses: { "201": { description: created } }
  /findings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    get: { responses: { "200": { description: ok } } }
  /users:
    get: { responses: { "200": { description: ok } } }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    get: { responses: { "200": { description: ok } } }
