apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulntrack
  namespace: istio-system
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-port: '15021'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:825990809758:certificate/b79f4f95-d533-42e9-9528-7ff03d142ebc
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-2:825990809758:regional/webacl/vulntrack-eks-waf/6231c747-ff79-4b5a-aae5-4ee3edef82d7
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    external-dns.alpha.kubernetes.io/hostname: aws.vulntrack.app
spec:
  ingressClassName: alb
  rules:
    - host: aws.vulntrack.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
