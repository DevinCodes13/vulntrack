alertmanager:
  alertmanagerSpec:
    # Mounts the Secret at /etc/alertmanager/secrets/alertmanager-ses/
    secrets:
      - alertmanager-ses
  config:
    global:
      # Region matters: an SES SMTP password is derived with the region
      # baked in and only authenticates against that region's endpoint.
      smtp_smarthost: 'email-smtp.us-east-1.amazonaws.com:587'
      smtp_from: '144kfilms@gmail.com'
      smtp_auth_username: 'REPLACE_WITH_YOUR_SES_SMTP_USERNAME'
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-ses/smtp_password'
      smtp_require_tls: true
    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # Default is to send nothing. kube-prometheus-stack ships dozens of
      # generic alerts; emailing all of them is how an inbox becomes noise
      # you learn to ignore. Only alerts written deliberately for this
      # application reach email. The rest still evaluate and stay visible
      # in the UI.
      receiver: 'null'
      routes:
        - receiver: 'email'
          matchers:
            - alertname =~ "VulnTrack.*"
    receivers:
      - name: 'null'
      - name: 'email'
        email_configs:
          - to: '144kfilms@gmail.com'
            send_resolved: true
            headers:
              subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
